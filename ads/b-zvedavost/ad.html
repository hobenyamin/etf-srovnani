<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=block">
<link rel="stylesheet" href="../_shared/ad.css">
<title>Reklama B – zvědavost</title>
<style>
  h1 { font-size: 104px; line-height: 1.02; margin-top: 36px; }
  .lead { font-size: 40px; line-height: 1.3; margin-top: 28px; }
  .receipt { margin-top: 56px; }
  .tick { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
  .no { color: var(--loss); }
  .yes { color: var(--keep); }
  .f-1x1 h1 { font-size: 88px; margin-top: 24px; }
  .f-1x1 .lead { font-size: 34px; margin-top: 18px; }
  .f-1x1 .receipt { margin-top: 36px; }
</style>
</head>
<body>
<script>document.body.className = "f-" + (new URLSearchParams(location.search).get("f") || "4x5");</script>
<main class="frame">
  <p class="label">Srovnání ETF z NYSE · pro investory v ČR</p>
  <h1>Proč si v&nbsp;Česku nekoupíte VOO?</h1>
  <p class="lead">A&nbsp;jaké alternativy jsou v&nbsp;ČR dostupné.</p>
  <div class="receipt">
    <div class="row">
      <span><span class="num">VOO</span> · NYSE Arca<span class="sub">fond z&nbsp;USA</span></span>
      <span class="tick no">bez KID</span>
    </div>
    <div class="row">
      <span>Fondy UCITS<span class="sub">stejný index S&amp;P&nbsp;500</span></span>
      <span class="tick yes">s&nbsp;KID</span>
    </div>
  </div>
  <div class="spacer"></div>
  <p class="note">KID vyžaduje nařízení PRIIPs pro prodej drobným investorům v&nbsp;EU. Vzdělávací srovnání, ne doporučení.</p>
</main>
</body>
</html>
